<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ItsRaeFaub IG Ideas">
<meta name="theme-color" content="#121212">
<title>ItsRaeFaub IG Video Ideas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css">
<style>
  :root{
    --bg:#121212;
    --card:#1c1c1a;
    --line:#302f2b;
    --text:#f2f0ea;
    --text-dim:#a8a69d;
    --accent:#ff3d75;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;
    padding-bottom:3rem;
  }
  .display{font-family:'Bebas Neue',sans-serif;letter-spacing:0.02em;}
  header{padding:1.25rem 1.25rem 1rem;border-bottom:1px solid var(--line);}
  header h1{font-size:28px;margin:0 0 2px;line-height:1.1;}
  header p{margin:0 0 14px;color:var(--text-dim);font-size:13px;font-style:italic;}
  .progress-wrap{display:flex;align-items:center;gap:10px;}
  .progress-track{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden;}
  .progress-fill{height:100%;background:var(--accent);border-radius:3px;transition:width 0.35s ease;}
  .progress-num{font-size:13px;color:var(--text-dim);white-space:nowrap;font-variant-numeric:tabular-nums;}
  main{padding:1.25rem;}
  #tile-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .tile{
    border-radius:14px;padding:16px 14px;cursor:pointer;
    background:var(--tile-bg);border:1.5px solid var(--tile-border);
    -webkit-tap-highlight-color:transparent;
  }
  .tile i{font-size:22px;color:var(--tile-border);}
  .tile p.tile-name{margin:10px 0 3px;font-size:16px;}
  .tile p.tile-count{margin:0;font-size:12.5px;color:var(--text-dim);font-variant-numeric:tabular-nums;}
  #archive-tile{
    margin-top:12px;border-radius:14px;padding:14px;
    background:var(--card);border:1.5px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;cursor:pointer;
  }
  #archive-tile .left{display:flex;align-items:center;gap:10px;}
  #archive-tile i{font-size:20px;color:var(--text-dim);}
  #archive-tile p{margin:0;font-size:14px;}
  #archive-tile span{font-size:12.5px;color:var(--text-dim);}
  #next-up{
    margin-top:12px;border-radius:14px;padding:14px;
    background:var(--card);border:1.5px solid var(--accent);cursor:pointer;
  }

  #overlay{
    position:fixed;inset:0;background:rgba(0,0,0,0.6);
    display:none;align-items:flex-end;justify-content:center;z-index:50;
  }
  #overlay.open{display:flex;}
  #sheet{
    background:var(--bg);width:100%;max-width:480px;
    border-radius:18px 18px 0 0;border:1px solid var(--line);border-bottom:none;
    max-height:82vh;display:flex;flex-direction:column;
  }
  #sheet-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 16px 10px;border-bottom:1px solid var(--line);flex:0 0 auto;
  }
  #sheet-head h2{font-size:20px;margin:0;font-weight:400;}
  #sheet-close{
    width:30px;height:30px;border-radius:50%;border:none;background:var(--card);
    color:var(--text);display:flex;align-items:center;justify-content:center;
    font-size:18px;line-height:1;padding:0;
  }
  #sheet-body{overflow-y:auto;padding:10px 16px 20px;display:flex;flex-direction:column;gap:6px;}
  .item{display:flex;gap:10px;align-items:flex-start;background:var(--card);border-radius:10px;padding:10px 12px;}
  .item input[type=checkbox]{
    appearance:none;-webkit-appearance:none;width:20px;height:20px;flex:0 0 20px;margin-top:2px;
    border:1.5px solid var(--text-dim);border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .item input[type=checkbox]:checked{background:var(--accent);border-color:var(--accent);}
  .item input[type=checkbox]:checked::after{content:"\2713";color:#1a0a10;font-size:13px;font-weight:600;}
  .item-title{margin:0;font-size:14px;font-weight:500;}
  .item-desc{margin:2px 0 0;font-size:12.5px;color:var(--text-dim);line-height:1.4;}
  .empty-note{font-size:13px;color:var(--text-dim);padding:10px 0;font-style:italic;}
  .archive-row{display:flex;gap:10px;align-items:center;background:transparent;border-radius:10px;padding:8px 4px;}
  .archive-row .item-title{text-decoration:line-through;color:var(--text-dim);flex:1;font-weight:400;}
  .archive-cat-tag{font-size:10.5px;color:var(--text-dim);border:1px solid var(--line);padding:2px 7px;border-radius:5px;white-space:nowrap;}
  footer{text-align:center;color:var(--text-dim);font-size:11.5px;padding:1.5rem 1rem 0;}
</style>
</head>

<header>
  <h1 class="display">ItsRaeFaub IG video ideas</h1>
  <p>"The version of you you want, is built on the days you don't feel like it."</p>
  <div class="progress-wrap">
    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
    <div class="progress-num" id="progress-num">0 / 0</div>
  </div>
</header>

<main>
  <div id="tile-grid"></div>
  <div id="archive-tile" onclick="openArchive()">

      <i class="ti ti-archive" aria-hidden="true"></i>
      <p>Archive</p>
    </div>
    <span id="archive-count">0 filmed</span>
  </div>
  <div id="next-up" onclick="goToNextUp()">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">
      <span style="font-size:11.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.04em;">Up next</span>
      <button id="shuffle-btn" onclick="event.stopPropagation();shuffleNextUp();" aria-label="Shuffle" style="width:26px;height:26px;padding:0;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--text-dim);display:flex;align-items:center;justify-content:center;">
        <i class="ti ti-refresh" style="font-size:14px;" aria-hidden="true"></i>
      </button>
    </div>
    <p id="next-up-title" style="margin:0;font-size:15px;font-weight:500;"></p>
    <p id="next-up-cat" style="margin:4px 0 0;font-size:12px;color:var(--text-dim);"></p>
  </div>
</main>

<footer></footer>

<div id="overlay" onclick="if(event.target===this)closeSheet()">
  <div id="sheet">
    <div id="sheet-head">
      <h2 class="display" id="sheet-title">Category</h2>
      <button id="sheet-close" onclick="closeSheet()" aria-label="Close">&times;</button>
    </div>
    <div id="sheet-body"></div>
  </div>
</div>

const STORAGE_KEY = "ig-video-bank-v2";
const CUSTOM_KEY = "ig-video-bank-custom-v1";

function loadState(){
  const raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ return JSON.parse(raw); }catch(e){} }
  const initial = {};
  DATA.forEach(item => initial[item.id] = !!item.done);
  return initial;
}
function loadCustom(){
  const raw = localStorage.getItem(CUSTOM_KEY);
  if(raw){ try{ return JSON.parse(raw); }catch(e){} }
  return [];
}
let state = loadState();
let customItems = loadCustom();
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function saveCustom(){ localStorage.setItem(CUSTOM_KEY, JSON.stringify(customItems)); }
function allItems(){ return DATA.concat(customItems); }
function addIdea(catKey, title, desc){
  const id = "u" + Date.now();
  customItems.push({id, cat:catKey, title, desc:desc || ""});
  state[id] = false;
  saveCustom();
  saveState();
}

function renderTiles(){
  const grid = document.getElementById("tile-grid");
  grid.innerHTML = "";
  let totalDone = 0;
  CATS.forEach(c => {
    const items = allItems().filter(i => i.cat === c.key);
    const done = items.filter(i => state[i.id]).length;
    totalDone += done;
    const tile = document.createElement("div");
    tile.className = "tile";
    tile.style.setProperty("--tile-bg", c.bg);
    tile.style.setProperty("--tile-border", c.border);
    tile.onclick = () => openSheet(c);
    tile.innerHTML = `
      <i class="ti ${c.icon}" aria-hidden="true"></i>
      <p class="tile-name">${c.name}</p>
      <p class="tile-count">${done} / ${items.length} done</p>
    `;
    grid.appendChild(tile);
  });
  const all = allItems();
  const archived = all.filter(i => state[i.id]).length;
  document.getElementById("archive-count").textContent = archived + " filmed";
  document.getElementById("progress-num").textContent = `${totalDone} / ${all.length}`;
  document.getElementById("progress-fill").style.width = `${(totalDone/all.length*100).toFixed(1)}%`;
  pickNextUp();
}

function openSheet(cat){
  document.getElementById("sheet-title").textContent = cat.name;
  const body = document.getElementById("sheet-body");
  body.innerHTML = "";
  const items = allItems().filter(i => i.cat === cat.key && !state[i.id]);
  if(items.length === 0){
    const note = document.createElement("div");
    note.className = "empty-note";
    note.textContent = "All filmed. Nice work.";
    body.appendChild(note);
  } else {
    items.forEach(item => {
      const row = document.createElement("label");
      row.className = "item";
      row.innerHTML = `
        <input type="checkbox" data-id="${item.id}">
        <div>
          <p class="item-title">${item.title}</p>
          <p class="item-desc">${item.desc}</p>
        </div>
      `;
      row.querySelector("input").onchange = (e) => {
        state[item.id] = e.target.checked;
        saveState();
        openSheet(cat);
        renderTiles();
      };
      body.appendChild(row);
    });
  }
  body.appendChild(buildAddForm(cat.key, () => { openSheet(cat); renderTiles(); }));
  document.getElementById("overlay").classList.add("open");
}

function buildAddForm(catKey, onAdded){
  const wrap = document.createElement("div");
  wrap.style.cssText = "margin-top:8px;padding-top:10px;border-top:1px solid var(--line);";
  const toggleBtn = document.createElement("button");
  toggleBtn.type = "button";
  toggleBtn.style.cssText = "width:100%;padding:10px;border-radius:10px;border:1.5px dashed var(--line);background:transparent;color:var(--text-dim);font-size:13px;";
  toggleBtn.innerHTML = '<i class="ti ti-plus" style="font-size:14px;vertical-align:-2px;margin-right:6px;" aria-hidden="true"></i>Add idea';

  const form = document.createElement("div");
  form.style.cssText = "display:none;flex-direction:column;gap:8px;margin-top:8px;";
  form.innerHTML = `
    <input type="text" placeholder="Idea title" id="new-title" style="width:100%;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;color:var(--text);font-size:14px;">
    <textarea placeholder="One-sentence detail (optional)" id="new-desc" rows="2" style="width:100%;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;color:var(--text);font-size:13px;font-family:inherit;resize:none;"></textarea>
    <p id="new-error" style="display:none;color:var(--accent);font-size:12px;margin:0;">Enter a title first</p>
    <div style="display:flex;gap:8px;">
      <button type="button" id="save-idea" style="flex:1;padding:10px;border-radius:8px;border:none;background:var(--accent);color:#fff;font-size:14px;font-weight:500;">Save</button>
      <button type="button" id="cancel-idea" style="padding:10px 14px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--text-dim);font-size:14px;">Cancel</button>
    </div>
  `;

  toggleBtn.onclick = () => {
    toggleBtn.style.display = "none";
    form.style.display = "flex";
    form.querySelector("#new-title").focus();
  };

  wrap.appendChild(toggleBtn);
  wrap.appendChild(form);

  setTimeout(() => {
    const titleInput = form.querySelector("#new-title");
    const descInput = form.querySelector("#new-desc");
    const errorNote = form.querySelector("#new-error");
    form.querySelector("#save-idea").onclick = () => {
      const t = titleInput.value.trim();
      if(!t){
        errorNote.style.display = "block";
        return;
      }
      addIdea(catKey, t, descInput.value.trim());
      onAdded();
    };
    form.querySelector("#cancel-idea").onclick = () => {
      toggleBtn.style.display = "block";
      form.style.display = "none";
      titleInput.value = "";
      descInput.value = "";
      errorNote.style.display = "none";
    };
    titleInput.oninput = () => { errorNote.style.display = "none"; };
  }, 0);

  return wrap;
}

function openArchive(){
  document.getElementById("sheet-title").textContent = "Archive";
  const body = document.getElementById("sheet-body");
  body.innerHTML = "";
  const items = allItems().filter(i => state[i.id]);
  if(items.length === 0){
    const note = document.createElement("div");
    note.className = "empty-note";
    note.textContent = "Nothing filmed yet.";
    body.appendChild(note);
  } else {
    items.forEach(item => {
      const catName = CATS.find(c => c.key === item.cat).name;
      const row = document.createElement("label");
      row.className = "archive-row";
      row.innerHTML = `
        <input type="checkbox" checked data-id="${item.id}">
        <p class="item-title">${item.title}</p>
        <span class="archive-cat-tag">${catName}</span>
      `;
      row.querySelector("input").onchange = (e) => {
        state[item.id] = e.target.checked;
        saveState();
        openArchive();
        renderTiles();
      };
      body.appendChild(row);
    });
  }
  document.getElementById("overlay").classList.add("open");
}

function closeSheet(){
  document.getElementById("overlay").classList.remove("open");
}

function pickNextUp(){
  const pool = allItems().filter(i => !state[i.id]);
  if(pool.length === 0){
    document.getElementById("next-up-title").textContent = "All caught up. Add a new idea.";
    document.getElementById("next-up-cat").textContent = "";
    window.__nextUpItem = null;
    return;
  }
  const pick = pool[Math.floor(Math.random() * pool.length)];
  window.__nextUpItem = pick;
  document.getElementById("next-up-title").textContent = pick.title;
  document.getElementById("next-up-cat").textContent = CATS.find(c => c.key === pick.cat).name;
}
function shuffleNextUp(){ pickNextUp(); }
function goToNextUp(){
  if(!window.__nextUpItem) return;
  const cat = CATS.find(c => c.key === window.__nextUpItem.cat);
  openSheet(cat);
}

renderTiles();
pickNextUp();
</script>
</body>
</html>
